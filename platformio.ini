[env:esp32-screen]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = arduino

monitor_speed = 115200
upload_speed = 921600
build_flags =
  -Ilib
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -mfix-esp32-psram-cache-issue

  ; ---- TFT_eSPI configuration (no library edits needed) ----
  ; Driver selection. The listing says "ST7789V 320x240" but ST7789 init gave no
  ; colour and ILI9341 gave only ~1/3 coverage + colour not persisting. Physical
  ; panel is ~6x9cm, and the identical symptom was solved (TFT_eSPI #2851) by a
  ; larger 320x480 panel using ILI9488_DRIVER. Trying that next.
  ; (Genuine ST7735 chips only reach ~128x160 -> use ST7735_DRIVER for those.)
  -DUSER_SETUP_LOADED=1
  -DILI9488_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480

  ; 7-pin SPI wiring (module label -> ESP32-S3 GPIO). VCC->3V3, GND->GND.
  ;   SCK (clock)     -> 36   (TFT_SCLK)
  ;   SDI (data/MOSI) -> 35   (TFT_MOSI)
  ;   CS  (chip sel)  -> 12   (TFT_CS)
  ;   D/S (DC select) -> 13   (TFT_DC)   ; a.k.a. A0 / RS / RSET
  ;   RST (reset)     -> 14   (TFT_RST)
  ;   BL  (backlight)-> 3V3  (Option A: always on, no config needed)
  ;                        OR a spare GPIO (Option B, uncomment + fill in):
  ;-DTFT_BL=16   ; <- backlight on a GPIO so TFT_eSPI controls it
  -DTFT_MOSI=35
  -DTFT_SCLK=36
  -DTFT_CS=12
  -DTFT_DC=13
  -DTFT_RST=14

  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DSPI_FREQUENCY=27000000

lib_extra_dirs = lib
build_src_filter = +<esp32_s3/main_screen.cpp>

; TFT_eSPI is vendored (and patched) in lib/TFT_eSPI - see the SPI_PORT
; fix in lib/TFT_eSPI/Processors/TFT_eSPI_ESP32_S3.h. Do NOT add it back to
; lib_deps (registry 2.5.43 crashes on ESP32-S3 with a 0x10 StoreProhibited).
lib_deps =

; ---------------------------------------------------------------------------
; Smart Mirror dashboard - same S3 + 480x320 ILI9488, plus WiFi/MQTT/HTTP.
; Flash:  pio run -e esp32-dashboard -t upload
[env:esp32-dashboard]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; WORKAROUND for IDF 4.4.x OPI-PSRAM + WiFi heap corruption (crash in
; esp_wifi_init -> heap_caps_calloc on the N16R8V, IDF #13906 / arduino #7349).
; Boot the physical OPI/OCT PSRAM in QUAD mode so PSRAM init fails gracefully;
; the dashboard does not need PSRAM, and WiFi then uses internal RAM instead.
; If WiFi still crashes, the real fix is the pioarduino espressif32 3.x
; (IDF 5.x) platform - see notes at the end of this env.
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
build_flags =
  -Ilib
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; NOTE: -mfix-esp32-psram-cache-issue is NOT used - it is a classic-ESP32 flag
  ; that is not valid on the ESP32-S3 and corrupts PSRAM heap during WiFi/PHY init
  ; (crashes inside WiFiManager autoConnect). Leave it out going forward.

  ; ---- TFT_eSPI (vendored + patched in lib/TFT_eSPI) ----
  -DUSER_SETUP_LOADED=1
  -DILI9488_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480

  ; 7-pin SPI wiring (module label -> GPIO): SCK->36 SDI->35 CS->12 D/S->13 RST->14
  -DTFT_MOSI=35
  -DTFT_SCLK=36
  -DTFT_CS=12
  -DTFT_DC=13
  -DTFT_RST=14

  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DSPI_FREQUENCY=27000000

lib_extra_dirs = lib
build_src_filter = +<esp32_s3/main_dashboard.cpp>

; Version pair matches the rest of the project (4relays etc.):
;   WiFiManager 2.0.x  +  ArduinoJson 7.x  (ArduinoJson v7 API is used in the sketch)
lib_deps =
  tzapu/WiFiManager
  knolleary/PubSubClient
  esphome/AsyncTCP-esphome
  esphome/ESPAsyncWebServer-esphome
  bblanchon/ArduinoJson